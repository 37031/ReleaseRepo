name: PR Validate & QA (print-only)

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  # Fast checks run automatically on PR open/update
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run static checks (print-only)
        run: |
          echo "🔎 Running PR validation checks..."
          echo "This is where you'd lint, test, or diff assets."
          echo "PR number: ${{ github.event.pull_request.number }}"
          echo "Branch:    ${{ github.head_ref }} → Target: ${{ github.base_ref }}"

  # Optional: gated "QA deployment" that needs environment approval
  promote-to-qa:
    name: QA approval gate (print-only)
    needs: [validate]
    runs-on: ubuntu-latest
    environment:
      name: QA            # Requires manual approval by QA environment reviewers
      url: https://example.com/your-qa-system
    steps:
      - name: Print 'would deploy' to QA
        run: |
          echo "🚀 (QA) Would deploy artifacts from the PR branch to QA."
          echo "PR: #${{ github.event.pull_request.number }} | Source: ${{ github.head_ref }}"
          echo "This step is gated by the QA environment approval."
